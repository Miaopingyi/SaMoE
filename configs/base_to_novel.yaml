DATASET:
  SUBSAMPLE_CLASSES: base
DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 4
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8
INPUT:
  SIZE: [224, 224]
  INTERPOLATION: bicubic
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: [random_resized_crop, normalize]
OPTIM:
  NAME: sgd
  LR: 0.0025
  MAX_EPOCH: 50
  LR_SCHEDULER: cosine
  WARMUP_EPOCH: 1
  WARMUP_TYPE: constant
  WARMUP_CONS_LR: 0.00001
MODEL:
  BACKBONE:
    NAME: ViT-B/16
TRAINER:
  SAMOE:
    N_CTX: 8
    CTX_INIT: a photo of a
    PREC: fp32
    PROMPT_DEPTH: 9
    NUM_EXPERTS: 4
    TOP_K: 2
    ROUTER_HIDDEN: 256
    LAMBDA_BALANCE: 0.1
    ROUTING: image-conditioned
    ROUTER_SHARING: shared
    EXPERT_BANK_SHARING: independent
    SAVE_PROMPT_ONLY: true
